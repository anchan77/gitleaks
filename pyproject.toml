[tool.poetry]
name = "gitleaks"
version = "0.1.0"
description = "Detect secrets and sensitive information in git repositories"
authors = ["gitleaks contributors"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/gitleaks/gitleaks"
repository = "https://github.com/gitleaks/gitleaks"
documentation = "https://github.com/gitleaks/gitleaks"
keywords = ["security", "secrets", "git", "leaks", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
packages = [{include = "gitleaks", from = "src"}]

[tool.poetry.scripts]
gitleaks = "gitleaks.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
structlog = "^24.0"
regex = "^2024.0"
gitpython = "^3.1.0"
jinja2 = "^3.1.0"
junit-xml = "^1.9"
py7zr = "^0.21.0"
rarfile = "^4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.12"
mypy = "^1.8"
ruff = "^0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.coverage.run]
source = ["src/gitleaks"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
