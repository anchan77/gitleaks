[tool.poetry]
name = "gitleaks"
version = "8.0.0"
description = "Detect and prevent hardcoded secrets like passwords, API keys, and tokens in git repos"
authors = ["Zach Rice <zricethezav@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/gitleaks/gitleaks"
repository = "https://github.com/gitleaks/gitleaks"
keywords = ["security", "secret-scanning", "git", "gitleaks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]
packages = [{include = "gitleaks", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.0"
structlog = "^24.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
GitPython = "^3.1.0"
Jinja2 = "^3.1.0"
junit-xml = "^1.9"
py7zr = "^0.21.0"
rarfile = "^4.2.0"
regex = "^2024.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^24.0.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
types-regex = "^2024.0.0"

[tool.poetry.scripts]
gitleaks = "gitleaks.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=gitleaks",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
